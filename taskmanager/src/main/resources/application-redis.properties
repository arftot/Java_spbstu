# Redis Cache profile configuration
spring.redis.host=redis
spring.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# PostgreSQL Database configuration (inherited from postgres profile)
spring.datasource.url=jdbc:postgresql://db:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info,caches
management.endpoint.health.show-details=when-authorized
