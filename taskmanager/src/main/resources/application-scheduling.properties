# Scheduling profile configuration
scheduler.fixedDelay.ms=60000
scheduler.initialDelay.ms=10000
scheduler.cron=0/60 * * * * ?

# Async thread pool configuration
async.corePoolSize=5
async.maxPoolSize=10
async.queueCapacity=100

# Redis configuration
spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# RabbitMQ configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Include redis profile configuration
spring.profiles.include=redis,postgres

# PostgreSQL Database configuration (inherited from postgres profile)
spring.datasource.url=jdbc:postgresql://db:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info,caches
management.endpoint.health.show-details=when-authorized
